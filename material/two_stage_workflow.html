.wf-title{font-size:23px;font-weight:850;fill:#14233c}

.wf-final{font-size:10.4px;font-weight:760;fill:#12895e}
.wf-footer{font-size:10px;font-weight:600;fill:#5e6e84}
.wf-line{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wf-flow{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 8;animation:wf-flow 3.5s linear infinite}
.wf-box{transition:filter .18s ease,stroke-width .18s ease}
.wf-node:hover .wf-box{filter:drop-shadow(0 5px 8px rgba(37,80,145,.13));stroke-width:1.8}
